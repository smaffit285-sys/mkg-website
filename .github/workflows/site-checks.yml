name: Site checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: git diff -- package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:chatbot
      - run: npm run test:forms
      - run: npm run check:links
