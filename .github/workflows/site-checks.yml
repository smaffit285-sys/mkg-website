name: Site checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:chatbot
      - run: npm run test:forms
      - run: npm run check:links
      - name: Live assistant mail-in smoke
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://www.miamiknifeguy.com/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ messages: [{ role: 'user', text: 'How do I mail in a knife?' }] }),
          });
          const body = await response.json();
          if (!response.ok || !body.reply?.includes('Do not ship yet') || !body.reply.includes('/book/mail-in/')) {
            throw new Error(`Assistant mail-in response failed with HTTP ${response.status}`);
          }
          NODE
